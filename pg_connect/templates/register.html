{% extends "base.html" %}
{% block title %}Create account | PG Connect{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">JOIN PG CONNECT</span><h2 class="fw-bold mt-2">Create your account</h2><p class="text-secondary">Choose the account type that fits you.</p>
<form method="post" class="mt-4">
<label class="form-label">Full name *</label><input class="form-control mb-3" name="name" required value="{{ request.form.get('name','') }}">
<label class="form-label">Email *</label><input class="form-control mb-3" type="email" name="email" required value="{{ request.form.get('email','') }}">
<label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ request.form.get('phone','') }}">
<label class="form-label">I am a *</label><select class="form-select mb-3" name="role"><option value="seeker">Student / working professional</option><option value="owner">PG owner</option></select>
<label class="form-label">Password (at least 8 characters) *</label><input class="form-control mb-4" type="password" name="password" minlength="8" required>
<button class="btn btn-brand w-100">Create account</button>
</form><p class="mt-3 mb-0 small text-secondary">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div>
{% endblock %}
