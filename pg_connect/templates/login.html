{% extends "base.html" %}
{% block title %}Log in | PG Connect{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h2 class="fw-bold mt-2">Log in</h2><p class="text-secondary">Access your PG Connect account.</p>
<form method="post" class="mt-4"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required>
<button class="btn btn-brand w-100">Log in</button></form>
<div class="demo-box mt-4"><strong>Try the demo</strong><br><span class="small">Owner: owner@example.com / Owner@123</span><br><span class="small">Student: student@example.com / Student@123</span></div>
<p class="mt-3 mb-0 small text-secondary">New to PG Connect? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>
{% endblock %}
